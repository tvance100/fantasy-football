name: Start/Sit emails

# Runs the tool on GitHub's servers so the emails don't depend on the Mac being
# awake. Each tick is cheap: run.py --scheduled only sends a game day's email
# when its deadline is within FIRE_LEAD_MINUTES and it hasn't been sent yet,
# and it reads the NFL schedule itself, so every game day (Thu/Sun/Mon plus
# Wed/Fri/Sat/Tue/holiday games) is covered without changing this file.
#
# Cron is UTC: 10:00-23:45 UTC = 5am-6:45pm EST / 6am-7:45pm EDT, every day.
on:
  schedule:
    - cron: "7,22,37,52 10-23 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args for run.py (e.g. --force --window monday)"
        required: false
        default: ""

concurrency:
  group: startsit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRE_LEAD_MINUTES: "120"
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ffcache-${{ github.run_id }}
          restore-keys: ffcache-

      - name: Write .env from secret
        id: env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::warning::DOTENV secret is not set yet - skipping this run"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$DOTENV" > .env
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.env.outputs.ready == 'true'
        run: uv sync --frozen

      - name: Run scheduled tick
        if: steps.env.outputs.ready == 'true'
        run: uv run python run.py --scheduled ${{ github.event.inputs.args }}

      - name: Save send state
        if: always() && steps.env.outputs.ready == 'true'
        run: |
          rm -f .env
          git config user.name "startsit-bot"
          git config user.email "startsit-bot@users.noreply.github.com"
          git add .state
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "Update send state [skip ci]"
          git pull --rebase
          git push
