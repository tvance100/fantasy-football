[project]
name = "fantasy-football"
version = "0.1.0"
description = "Multi-league ESPN fantasy football start/sit engine"
requires-python = ">=3.10"
dependencies = [
    "nfl_data_py>=0.3.2",
    "espn-api>=0.45.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffball"]
